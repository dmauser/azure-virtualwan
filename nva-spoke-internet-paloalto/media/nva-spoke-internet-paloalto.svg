<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720"
     viewBox="0 0 1400 720" font-family="Segoe UI, Arial, sans-serif">
  <title>NVA Spoke Internet &#x2014; Palo Alto VM-Series Variant</title>
  <defs>
    <marker id="m-data" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="#1e293b"/>
    </marker>
    <marker id="m-ctrl" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
    <marker id="m-ipsec" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="#b45309"/>
    </marker>
    <marker id="m-ipsec-r" markerWidth="10" markerHeight="7"
            refX="1" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="700" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">NVA Spoke Internet &#x2014; Palo Alto VM-Series variant</text>
  <text x="700" y="56" text-anchor="middle" font-size="11" fill="#64748b">vwan-nva-si &#xB7; hub-nva-si (10.100.0.0/23) &#xB7; Palo Alto VM-Series NVAs &#xB7; eastus2</text>

  <!-- ═══════════ CONTAINERS ═══════════ -->

  <!-- On-Premises (optional, dashed) -->
  <rect x="20" y="285" width="200" height="225" rx="12"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="31" y="304" font-size="12" font-weight="bold" fill="#94a3b8">On-Premises</text>
  <text x="31" y="320" font-size="10" fill="#94a3b8">(Optional) 192.168.100.0/24</text>

  <!-- Virtual WAN Hub -->
  <rect x="255" y="110" width="300" height="370" rx="12"
        fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="266" y="129" font-size="12" font-weight="bold" fill="#2563eb">Virtual WAN Hub</text>
  <text x="266" y="145" font-size="10" fill="#2563eb">hub-nva-si &#xB7; 10.100.0.0/23</text>

  <!-- DMZ VNet -->
  <rect x="615" y="90" width="548" height="440" rx="12"
        fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="626" y="109" font-size="12" font-weight="bold" fill="#d97706">DMZ VNet &#x2014; vnet-dmz &#x2014; 10.0.0.0/24</text>

  <!-- Spoke1 VNet -->
  <rect x="255" y="560" width="155" height="140" rx="12"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="266" y="579" font-size="12" font-weight="bold" fill="#16a34a">Spoke1 VNet</text>
  <text x="266" y="595" font-size="10" fill="#16a34a">vnet-spoke1 &#xB7; 10.1.0.0/24</text>

  <!-- Spoke2 VNet -->
  <rect x="442" y="560" width="155" height="140" rx="12"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="453" y="579" font-size="12" font-weight="bold" fill="#16a34a">Spoke2 VNet</text>
  <text x="453" y="595" font-size="10" fill="#16a34a">vnet-spoke2 &#xB7; 10.2.0.0/24</text>

  <!-- Internet cloud -->
  <rect x="1185" y="192" width="152" height="140" rx="22"
        fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1261" y="240" text-anchor="middle" font-size="26" fill="#1d4ed8">&#x2601;</text>
  <text x="1261" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Internet</text>
  <text x="1261" y="286" text-anchor="middle" font-size="10" fill="#3b82f6">pip-lb-pa-public</text>
  <text x="1261" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">(Egress IP)</text>

  <!-- ═══════════ INNER BOXES ═══════════ -->

  <!-- On-prem VM -->
  <rect x="35" y="325" width="170" height="50" rx="8"
        fill="white" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="120" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">vm-onprem</text>
  <text x="120" y="363" text-anchor="middle" font-size="10" fill="#64748b">192.168.100.33</text>

  <!-- On-prem NVA (Linux IPsec) -->
  <rect x="35" y="392" width="170" height="75" rx="8"
        fill="white" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="120" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">nva-onprem</text>
  <text x="120" y="434" text-anchor="middle" font-size="10" fill="#64748b">Linux IPsec NVA</text>
  <text x="120" y="451" text-anchor="middle" font-size="10" fill="#64748b">192.168.100.2</text>

  <!-- On-prem UDR note -->
  <text x="120" y="498" text-anchor="middle" font-size="9" fill="#94a3b8">UDR: spokes &#x2192; via NVA</text>

  <!-- VPN Gateway (optional, dashed) -->
  <rect x="272" y="155" width="262" height="65" rx="8"
        fill="white" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="7 3"/>
  <text x="403" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">VPN Gateway</text>
  <text x="403" y="200" text-anchor="middle" font-size="10" fill="#3b82f6">S2S &#xB7; BGP &#xB7; (optional)</text>

  <!-- Hub BGP Router -->
  <rect x="272" y="250" width="262" height="135" rx="8"
        fill="white" stroke="#2563eb" stroke-width="1.8"/>
  <text x="403" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Hub BGP Router</text>
  <text x="403" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">10.100.0.68</text>
  <text x="403" y="330" text-anchor="middle" font-size="10" fill="#3b82f6">Learns 0.0.0.0/0 via conn-dmz</text>
  <text x="403" y="347" text-anchor="middle" font-size="9" fill="#64748b">Propagates to Spoke1, Spoke2</text>

  <!-- ILB (trust side) -->
  <rect x="635" y="168" width="148" height="112" rx="8"
        fill="white" stroke="#d97706" stroke-width="1.8"/>
  <text x="709" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">lb-ilb-pa</text>
  <text x="709" y="220" text-anchor="middle" font-size="10" fill="#d97706">Internal Load Balancer</text>
  <text x="709" y="237" text-anchor="middle" font-size="10" fill="#d97706">HA Ports &#xB7; trust side</text>
  <text x="709" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Frontend: 10.0.0.68</text>

  <!-- PA-FW-1 -->
  <rect x="835" y="140" width="140" height="115" rx="8"
        fill="white" stroke="#d97706" stroke-width="1.8"/>
  <text x="905" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">PA-FW-1</text>
  <text x="905" y="180" text-anchor="middle" font-size="10" fill="#d97706">Palo Alto VM-Series</text>
  <text x="905" y="197" text-anchor="middle" font-size="10" fill="#d97706">trust&#x2192;untrust SNAT</text>
  <text x="905" y="214" text-anchor="middle" font-size="10" fill="#64748b">10.0.0.4 (trust NIC)</text>
  <line x1="843" y1="223" x2="967" y2="223" stroke="#e2e8f0" stroke-width="1"/>
  <text x="905" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">mgmt &#xB7; untrust &#xB7; trust</text>

  <!-- PA-FW-2 -->
  <rect x="835" y="267" width="140" height="115" rx="8"
        fill="white" stroke="#d97706" stroke-width="1.8"/>
  <text x="905" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">PA-FW-2</text>
  <text x="905" y="307" text-anchor="middle" font-size="10" fill="#d97706">Palo Alto VM-Series</text>
  <text x="905" y="324" text-anchor="middle" font-size="10" fill="#d97706">trust&#x2192;untrust SNAT</text>
  <text x="905" y="341" text-anchor="middle" font-size="10" fill="#64748b">10.0.0.5 (trust NIC)</text>
  <line x1="843" y1="350" x2="967" y2="350" stroke="#e2e8f0" stroke-width="1"/>
  <text x="905" y="365" text-anchor="middle" font-size="9" fill="#94a3b8">mgmt &#xB7; untrust &#xB7; trust</text>

  <!-- PLB (untrust/public side) -->
  <rect x="1007" y="178" width="148" height="112" rx="8"
        fill="white" stroke="#d97706" stroke-width="1.8"/>
  <text x="1081" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">lb-pa-public</text>
  <text x="1081" y="230" text-anchor="middle" font-size="10" fill="#d97706">Public Load Balancer</text>
  <text x="1081" y="247" text-anchor="middle" font-size="10" fill="#d97706">SNAT outbound</text>
  <text x="1081" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">pip-lb-pa-public</text>

  <!-- vm-spoke1 -->
  <rect x="272" y="603" width="120" height="72" rx="8"
        fill="white" stroke="#16a34a" stroke-width="1.8"/>
  <text x="332" y="626" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">vm-spoke1</text>
  <text x="332" y="643" text-anchor="middle" font-size="11" fill="#16a34a">10.1.0.4</text>
  <text x="332" y="660" text-anchor="middle" font-size="9" fill="#64748b">snet-workload</text>

  <!-- vm-spoke2 -->
  <rect x="450" y="603" width="120" height="72" rx="8"
        fill="white" stroke="#16a34a" stroke-width="1.8"/>
  <text x="510" y="626" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">vm-spoke2</text>
  <text x="510" y="643" text-anchor="middle" font-size="11" fill="#16a34a">10.2.0.4</text>
  <text x="510" y="660" text-anchor="middle" font-size="9" fill="#64748b">snet-workload</text>

  <!-- ═══════════ ARROWS ═══════════ -->

  <!-- IPsec S2S: on-prem NVA ↔ VPN Gateway (bidirectional, dashed amber) -->
  <path d="M 205,430 L 239,430 L 239,188 L 272,188"
        fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5"
        marker-start="url(#m-ipsec-r)" marker-end="url(#m-ipsec)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spoke1 VM → Hub (upward) -->
  <path d="M 332,560 L 332,480"
        fill="none" stroke="#1e293b" stroke-width="3"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spoke2 VM → Hub (upward) -->
  <path d="M 510,560 L 510,480"
        fill="none" stroke="#1e293b" stroke-width="3"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 0/0 route advertisement hub → spokes (purple dashed) -->
  <path d="M 421,480 L 421,560"
        fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"
        marker-end="url(#m-ctrl)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hub → ILB (via conn-dmz static route) -->
  <path d="M 555,295 L 615,295 L 615,224 L 635,224"
        fill="none" stroke="#1e293b" stroke-width="3"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ILB → PA-FW-1 (horizontal, upper) -->
  <path d="M 783,198 L 835,198"
        fill="none" stroke="#1e293b" stroke-width="2.5"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ILB → PA-FW-2 (L-shaped, lower) -->
  <path d="M 783,250 L 808,250 L 808,325 L 835,325"
        fill="none" stroke="#1e293b" stroke-width="2.5"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PA-FW-1 → PLB (L-shaped, upper) -->
  <path d="M 975,198 L 991,198 L 991,220 L 1007,220"
        fill="none" stroke="#1e293b" stroke-width="2.5"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PA-FW-2 → PLB (L-shaped, lower, upward) -->
  <path d="M 975,325 L 991,325 L 991,248 L 1007,248"
        fill="none" stroke="#1e293b" stroke-width="2.5"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PLB → Internet -->
  <path d="M 1155,234 L 1185,234"
        fill="none" stroke="#1e293b" stroke-width="3"
        marker-end="url(#m-data)"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════ NUMBERED HOP BADGES ═══════════ -->

  <!-- Badge ① Spoke1 VM -->
  <circle cx="332" cy="516" r="13" fill="white"/>
  <circle cx="332" cy="516" r="10" fill="#1e293b"/>
  <text x="332" y="520" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1</text>

  <!-- Badge ① Spoke2 VM -->
  <circle cx="510" cy="516" r="13" fill="white"/>
  <circle cx="510" cy="516" r="10" fill="#1e293b"/>
  <text x="510" y="520" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1</text>

  <!-- Badge ② Hub BGP Router (defaultRouteTable 0/0) -->
  <circle cx="403" cy="263" r="13" fill="white"/>
  <circle cx="403" cy="263" r="10" fill="#2563eb"/>
  <text x="403" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2</text>

  <!-- Badge ③ conn-dmz static route -->
  <circle cx="608" cy="260" r="13" fill="white"/>
  <circle cx="608" cy="260" r="10" fill="#2563eb"/>
  <text x="608" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3</text>

  <!-- Badge ④ ILB HA ports (trust side) -->
  <circle cx="808" cy="178" r="13" fill="white"/>
  <circle cx="808" cy="178" r="10" fill="#d97706"/>
  <text x="808" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="white">4</text>

  <!-- Badge ⑤ PA-FW trust→untrust SNAT -->
  <circle cx="991" cy="165" r="13" fill="white"/>
  <circle cx="991" cy="165" r="10" fill="#d97706"/>
  <text x="991" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="white">5</text>

  <!-- Badge ⑥ PLB SNAT → public IP -->
  <circle cx="1168" cy="216" r="13" fill="white"/>
  <circle cx="1168" cy="216" r="10" fill="#1e293b"/>
  <text x="1168" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="white">6</text>

  <!-- Badge ⑦ Internet -->
  <circle cx="1310" cy="205" r="13" fill="white"/>
  <circle cx="1310" cy="205" r="10" fill="#2563eb"/>
  <text x="1310" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="white">7</text>

  <!-- ═══════════ ANNOTATIONS ═══════════ -->

  <!-- 0/0 adv. label -->
  <text x="428" y="518" font-size="9" fill="#7c3aed">0/0 adv.</text>

  <!-- IPsec S2S rotated label -->
  <text x="234" y="318" text-anchor="middle" font-size="9" fill="#b45309"
        transform="rotate(-90 234 318)">IPsec S2S</text>

  <!-- conn-dmz + next-hop callout -->
  <text x="621" y="308" font-size="9" fill="#64748b">conn-dmz</text>
  <text x="621" y="320" font-size="9" fill="#64748b">0/0&#x2192;10.0.0.68</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <rect x="870" y="558" width="280" height="120" rx="8"
        fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1010" y="575" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Legend</text>

  <line x1="882" y1="594" x2="925" y2="594"
        stroke="#1e293b" stroke-width="2.8" marker-end="url(#m-data)"/>
  <text x="932" y="598" font-size="10" fill="#1e293b">Internet egress data path</text>

  <line x1="882" y1="620" x2="925" y2="620"
        stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#m-ctrl)"/>
  <text x="932" y="624" font-size="10" fill="#7c3aed">Route advertisement (0/0)</text>

  <line x1="882" y1="646" x2="925" y2="646"
        stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 4"
        marker-start="url(#m-ipsec-r)" marker-end="url(#m-ipsec)"/>
  <text x="932" y="650" font-size="10" fill="#b45309">IPsec S2S tunnel (optional)</text>

  <!-- ═══════════ FOOTER ═══════════ -->
  <rect x="10" y="703" width="1380" height="14" rx="4" fill="#e2e8f0"/>
  <text x="700" y="714" text-anchor="middle" font-size="9" fill="#475569">&#x2460; Spoke VM &#x2192; &#x2461; Hub defaultRouteTable (0/0) &#x2192; &#x2462; conn-dmz static route &#x2192; &#x2463; ILB 10.0.0.68 (HA ports) &#x2192; &#x2464; PA-FW trust&#x2192;untrust SNAT &#x2192; &#x2465; lb-pa-public SNAT &#x2192; pip-lb-pa-public &#x2192; &#x2466; Internet</text>
</svg>
