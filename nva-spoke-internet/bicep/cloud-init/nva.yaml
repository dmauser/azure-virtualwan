#cloud-config
# DMZ NVA: enable IP forwarding + iptables MASQUERADE for spoke internet egress
package_update: true
packages:
  - iptables-persistent

write_files:
  - path: /etc/sysctl.d/99-ip-forward.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root:root
    permissions: '0644'

runcmd:
  - sysctl -w net.ipv4.ip_forward=1
  # MASQUERADE all outbound traffic on eth0 (SNAT'd again by Public LB outbound rule)
  - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
  # Allow forwarded traffic (default FORWARD policy is DROP on Ubuntu)
  - iptables -A FORWARD -j ACCEPT
  # Allow SSH inbound (health probe + mgmt)
  - iptables -A INPUT -p tcp --dport 22 -j ACCEPT
  # Persist rules across reboots
  - netfilter-persistent save
